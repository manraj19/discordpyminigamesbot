name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/minigames-bot
            # Reset rather than pull: the droplet is a deploy target that holds no
            # local commits, and --ff-only cannot cross a force-push, which left
            # deploys failing after a history rewrite. Ignored files (scores.db and
            # its sidecars) are untouched by reset --hard.
            git fetch --prune origin
            git reset --hard origin/main
            .venv/bin/pip install -q -r requirements.txt
            sudo /usr/bin/systemctl restart minigames-bot
            sleep 5
            systemctl is-active --quiet minigames-bot
            git log -1 --oneline
